<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Объект — Однолинейка</title>
<style>
:root{
  --bg:#f6f7f9; --panel:#fff; --line:#e3e6ea; --text:#1d2329; --muted:#6a737d; --accent:#2563eb;
  --err:#c62828; --err-bg:#fdecec; --warn:#a86b00; --warn-bg:#fff6dc; --ok:#2e7d32; --ok-bg:#e8f5e9; --sel:#e8f0fe;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#15181c; --panel:#1d2126; --line:#2e343b; --text:#e6e9ec; --muted:#9aa4ae; --accent:#6ea0ff;
  --err:#ff6b6b; --err-bg:#3a1f22; --warn:#f0b43c; --warn-bg:#3a3020; --ok:#6fcf73; --ok-bg:#1f3322; --sel:#243049;
}}
*{box-sizing:border-box}
body{margin:0;font:14px/1.4 "Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--text);height:100vh;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:16px;padding:8px 16px;background:var(--panel);border-bottom:1px solid var(--line)}
header h1{font-size:16px;margin:0}
header .sp{flex:1}
button{font:inherit;padding:5px 12px;border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:6px;cursor:pointer}
button:hover{border-color:var(--accent)}
button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.wrap{flex:1;display:flex;min-height:0}
aside{width:290px;background:var(--panel);border-right:1px solid var(--line);overflow:auto;padding:8px 0}
main{flex:1;overflow:auto;padding:16px}
.node{display:flex;align-items:center;gap:6px;padding:4px 12px;cursor:pointer;white-space:nowrap}
.node:hover{background:var(--sel)}
.node.sel{background:var(--sel);font-weight:600}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.d2{background:var(--err)}.d1{background:var(--warn)}.d0{background:var(--ok)}
.cnt{margin-left:auto;font-size:12px;color:var(--muted)}
.node.obj{font-weight:600;border-bottom:1px solid var(--line);margin-bottom:4px;padding-bottom:8px}
h2{font-size:18px;margin:0 0 4px}
.sub{color:var(--muted);margin-bottom:12px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px;margin-bottom:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.card .k{font-size:12px;color:var(--muted)}
.card .v{font-size:16px;font-weight:600}
.card.e{border-color:var(--err)}.card.w{border-color:var(--warn)}
table{border-collapse:collapse;width:100%;background:var(--panel);border:1px solid var(--line)}
th,td{padding:4px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{position:sticky;top:-16px;background:var(--panel);font-size:12px;color:var(--muted);font-weight:600;z-index:1}
td.n{text-align:right;font-variant-numeric:tabular-nums}
tr.l2 td{background:var(--err-bg)} tr.l1 td{background:var(--warn-bg)}
tr.hl td{outline:2px solid var(--accent);outline-offset:-2px}
tr.click{cursor:pointer} tr.click:hover td{filter:brightness(.97)}
.st{font-size:12px}
.l2t{color:var(--err)}.l1t{color:var(--warn)}
a{color:var(--accent);cursor:pointer;text-decoration:none}
a:hover{text-decoration:underline}
.tabs{display:flex;gap:6px;margin:6px 0 12px;flex-wrap:wrap}
.filters{display:flex;gap:8px;align-items:center;margin-bottom:10px;flex-wrap:wrap}
input[type=search]{font:inherit;padding:5px 8px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--text);min-width:240px}
.msg{position:fixed;bottom:16px;right:16px;background:var(--text);color:var(--bg);padding:8px 14px;border-radius:8px;display:none;max-width:480px}
.issues{margin:0 0 14px;padding:0;list-style:none}
.issues li{padding:4px 0;border-bottom:1px solid var(--line)}
.tag{font-size:11px;padding:1px 6px;border-radius:4px;border:1px solid var(--line);color:var(--muted);margin-left:6px}
.empty{color:var(--muted);padding:20px}
</style>
</head>
<body>
<header>
  <h1 id="title">Объект</h1>
  <span class="sub" id="stamp" style="margin:0"></span>
  <span class="sp"></span>
  <button id="reload" title="Перечитать книги, которые изменились">Обновить</button>
</header>
<div class="wrap">
  <aside id="tree"></aside>
  <main id="main"><div class="empty">Загрузка…</div></main>
</div>
<div class="msg" id="msg"></div>
<script>
let P = null, panels = {}, byPanel = {}, sel = "", tab = "issues", filt = {lvl: 0, src: "", q: ""}, hl = "";
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const f = (x, d = 1) => x == null ? "" : (Math.round(x * 10 ** d) / 10 ** d).toLocaleString("ru-RU");
function toast(t){const m=$("#msg");m.textContent=t;m.style.display="block";clearTimeout(m._t);m._t=setTimeout(()=>m.style.display="none",4000);}

async function load(){
  P = await (await fetch("/api/project")).json();
  panels = {}; byPanel = {};
  for (const b of P.books) for (const p of b.panels) panels[p.id] = p;
  for (const i of P.issues) (byPanel[i.panel] ||= []).push(i);
  $("#title").textContent = "Объект: " + P.name;
  $("#stamp").textContent = "прочитано " + P.imported + " · книг " + P.books.length + " · щитов " + Object.keys(panels).length;
  drawTree(); drawMain();
}
function worst(id){ return Math.max(0, ...(byPanel[id] || []).map(i => i.level)); }
function counts(list){ let e=0,w=0; for(const i of list||[]) i.level>=2?e++:w++; return [e,w]; }

function drawTree(){
  const kids = {}, roots = [];
  for (const p of Object.values(panels)) (p.parent && panels[p.parent] ? (kids[p.parent] ||= []) : roots).push(p);
  const [e,w] = counts(P.issues);
  let h = `<div class="node obj ${sel===""?"sel":""}" data-id=""><span class="dot d${e?2:w?1:0}"></span>Весь объект<span class="cnt">${e} / ${w}</span></div>`;
  const walk = (p, lvl) => {
    const [pe,pw] = counts(byPanel[p.id]);
    h += `<div class="node ${sel===p.id?"sel":""}" data-id="${esc(p.id)}" style="padding-left:${12+lvl*18}px" title="${esc(p.file)}">
      <span class="dot d${worst(p.id)}"></span>${esc(p.name)}<span class="cnt">${pe} / ${pw}</span></div>`;
    for (const k of (kids[p.id] || []).sort((a,b)=>a.name.localeCompare(b.name,"ru"))) walk(k, lvl+1);
  };
  for (const r of roots.sort((a,b)=>(kids[b.id]?.length||0)-(kids[a.id]?.length||0) || a.name.localeCompare(b.name,"ru"))) walk(r, 0);
  for (const b of P.books) if (b.error) h += `<div class="node" title="${esc(b.error)}"><span class="dot d2"></span>${esc(b.file)}</div>`;
  $("#tree").innerHTML = h;
  for (const n of document.querySelectorAll(".node[data-id]")) n.onclick = () => { sel = n.dataset.id; hl = ""; drawTree(); drawMain(); };
}

function issueRows(list, withPanel){
  const L = list.filter(i => (!filt.lvl || i.level === filt.lvl) && (!filt.src || i.source === filt.src) &&
    (!filt.q || (i.text + " " + i.line + " " + (panels[i.panel]?.name||"")).toLowerCase().includes(filt.q)));
  if (!L.length) return `<div class="empty">Замечаний нет.</div>`;
  let h = `<table><tr><th></th>${withPanel?"<th>Щит</th>":""}<th>Линия</th><th>Замечание</th><th>Откуда</th><th>Где править</th></tr>`;
  for (const i of L){
    const p = panels[i.panel];
    h += `<tr class="l${i.level} click" data-p="${esc(i.panel)}" data-l="${esc(i.line)}">
      <td>${i.level>=2?"<b class=l2t>ошибка</b>":"<span class=l1t>внимание</span>"}</td>
      ${withPanel?`<td>${esc(p?.name||i.panel)}</td>`:""}<td>${esc(i.line)}</td><td>${esc(i.text)}</td>
      <td><span class="tag">${esc(i.source)}</span></td>
      <td>${p && i.where ? `<a data-open="${esc(p.file)}" data-where="${esc(i.where.includes("→")?i.where.split("→")[1].trim():i.where)}" data-file2="${esc(i.where.includes("→")?i.where.split("→")[0].trim():"")}">${esc(i.where)}</a>` : esc(i.where)}</td></tr>`;
  }
  return h + "</table>";
}
function filters(){
  return `<div class="filters">
    <button data-lvl="0" class="${filt.lvl===0?"on":""}">Все</button>
    <button data-lvl="2" class="${filt.lvl===2?"on":""}">Ошибки</button>
    <button data-lvl="1" class="${filt.lvl===1?"on":""}">Внимание</button>
    <span style="width:8px"></span>
    <button data-src="" class="${filt.src===""?"on":""}">Все проверки</button>
    <button data-src="объект" class="${filt.src==="объект"?"on":""}">Связи щитов</button>
    <button data-src="Excel" class="${filt.src==="Excel"?"on":""}">Из книг</button>
    <input type="search" id="q" placeholder="Поиск: линия, щит, текст" value="${esc(filt.q)}"></div>`;
}

function drawMain(){
  const m = $("#main");
  if (!sel){
    const [e,w] = counts(P.issues);
    const ps = Object.values(panels);
    m.innerHTML = `<h2>Весь объект</h2><div class="sub">${esc(P.folder)}</div>
      <div class="cards">
        <div class="card ${e?"e":""}"><div class="k">Ошибок</div><div class="v">${e}</div></div>
        <div class="card ${w?"w":""}"><div class="k">Внимание</div><div class="v">${w}</div></div>
        <div class="card"><div class="k">Щитов</div><div class="v">${ps.length}</div></div>
        <div class="card"><div class="k">Линий</div><div class="v">${ps.reduce((s,p)=>s+p.lines.length,0)}</div></div>
      </div>
      <div class="tabs"><button data-tab="issues" class="${tab==="issues"?"on":""}">Замечания</button>
        <button data-tab="panels" class="${tab==="panels"?"on":""}">Щиты</button></div>
      ${tab==="issues" ? filters() + issueRows(P.issues, true) : panelsTable(ps)}`;
  } else {
    const p = panels[sel], s = p.supply, par = panels[p.parent];
    const [e,w] = counts(byPanel[p.id]);
    const from = par ? `<a data-go="${esc(par.id)}">${esc(par.name)}</a>, линия ${esc(p.parent_line||"?")}`
               : esc(s.manual || s.from_file || "не задано");
    m.innerHTML = `<h2>${esc(p.name)}</h2>
      <div class="sub">${esc(p.file)} · <a data-open="${esc(p.file)}" data-where="Однолинейка!A1">открыть в Excel</a></div>
      <div class="cards">
        <div class="card"><div class="k">Питается от</div><div class="v" style="font-size:14px">${from}</div>
          <div class="k">${esc([s.breaker, s.cable, s.length!=null?("L="+f(s.length,0)+" м"):""].filter(Boolean).join(" · "))}</div></div>
        <div class="card"><div class="k">Руст / Рр, кВт</div><div class="v">${f(p.p_inst,2)} / ${f(p.p_calc,2)}</div></div>
        <div class="card"><div class="k">Iр, А · cos φ</div><div class="v">${f(p.i_calc,1)} · ${f(p.cos,2)}</div></div>
        <div class="card"><div class="k">ΔU до шин, %</div><div class="v">${f(p.du_bus,2)||"—"}</div></div>
        <div class="card"><div class="k">Iкз min / max на шинах</div><div class="v">${p.ikz_min_bus!=null?f(p.ikz_min_bus,0)+" А":"—"} / ${p.ikz_max_bus!=null?f(p.ikz_max_bus,2)+" кА":"—"}</div></div>
        <div class="card ${e?"e":w?"w":""}"><div class="k">Ошибок / внимание</div><div class="v">${e} / ${w}</div></div>
        <div class="card"><div class="k">Схема DWG / КЖ</div><div class="v" style="font-size:13px;color:var(--muted)">проверка актуальности — следующий шаг</div></div>
      </div>
      <div class="tabs"><button data-tab="lines" class="${tab!=="issues"?"on":""}">Линии (${p.lines.length})</button>
        <button data-tab="issues" class="${tab==="issues"?"on":""}">Замечания (${(byPanel[p.id]||[]).length})</button></div>
      ${tab==="issues" ? filters() + issueRows(byPanel[p.id]||[], false) : linesTable(p)}`;
  }
  bind();
  if (hl){ const r = document.querySelector(`tr[data-line="${CSS.escape(hl)}"]`); if (r) r.scrollIntoView({block:"center"}); }
}
function panelsTable(ps){
  let h = `<table><tr><th>Щит</th><th>Питается от</th><th class=n>Руст, кВт</th><th class=n>Рр, кВт</th><th class=n>Iр, А</th>
    <th>Фидер</th><th class=n>ΔU шин, %</th><th class=n>Iкз min, А</th><th class=n>Ошибок</th><th class=n>Внимание</th><th>Файл</th></tr>`;
  for (const p of ps){
    const [e,w] = counts(byPanel[p.id]), par = panels[p.parent];
    h += `<tr class="${e?"l2":w?"l1":""} click" data-go="${esc(p.id)}"><td><b>${esc(p.name)}</b></td>
      <td>${par?esc(par.name)+" / "+esc(p.parent_line):esc(p.supply.manual||"")}</td>
      <td class=n>${f(p.p_inst,2)}</td><td class=n>${f(p.p_calc,2)}</td><td class=n>${f(p.i_calc,1)}</td>
      <td>${esc(p.supply.breaker||"")} ${esc(p.supply.cable||"")}</td><td class=n>${f(p.du_bus,2)}</td><td class=n>${f(p.ikz_min_bus,0)}</td>
      <td class=n>${e}</td><td class=n>${w}</td><td style="color:var(--muted)">${esc(p.file)}</td></tr>`;
  }
  return h + "</table>";
}
function linesTable(p){
  let h = `<table><tr><th class=n>Место</th><th>QF</th><th>Линия</th><th>Наименование</th><th class=n>P, кВт</th><th>Фаза</th>
    <th class=n>Iр, А</th><th>Автомат</th><th>Кабель</th><th class=n>L, м</th><th class=n>ΔU Σ, %</th><th class=n>Iкз/In</th><th>Кат.</th><th>Статус</th></tr>`;
  for (const l of p.lines){
    const child = l.feeds && panels[l.feeds];
    h += `<tr class="l${l.level} ${hl===l.number?"hl":""}" data-line="${esc(l.number)}">
      <td class=n>${l.place??""}</td><td>${esc(l.qf)}</td><td>${esc(l.number)}</td>
      <td>${esc(l.name)}${child?` → <a data-go="${esc(child.id)}">${esc(child.name)}</a>`:""}</td>
      <td class=n>${f(l.p_kw,2)}</td><td>${esc(l.phase)}</td><td class=n>${f(l.i_calc,2)}</td>
      <td style="white-space:nowrap">${esc(l.breaker)}</td><td style="font-size:12px">${esc(l.cable)}</td><td class=n>${f(l.length,0)}</td>
      <td class=n ${l.du_sum!=null&&l.du_max!=null&&l.du_sum>l.du_max?'style="color:var(--err);font-weight:600"':""}>${f(l.du_sum,2)}</td>
      <td class=n>${f(l.ikz_ratio,1)}</td><td>${esc(l.category)}</td>
      <td class="st">${esc(l.status)} ${l.row_odn?`<a data-open="${esc(p.file)}" data-where="Однолинейка!R${l.row_odn}" title="Открыть в Excel">✎</a>`:""}</td></tr>`;
  }
  return h + "</table>";
}

function bind(){
  for (const b of document.querySelectorAll("[data-tab]")) b.onclick = () => { tab = b.dataset.tab; drawMain(); };
  for (const b of document.querySelectorAll("[data-lvl]")) b.onclick = () => { filt.lvl = +b.dataset.lvl; drawMain(); };
  for (const b of document.querySelectorAll("[data-src]")) b.onclick = () => { filt.src = b.dataset.src; drawMain(); };
  const q = $("#q"); if (q){ q.oninput = () => { filt.q = q.value.toLowerCase(); const pos=q.selectionStart; drawMain(); const q2=$("#q"); q2.focus(); q2.setSelectionRange(pos,pos); }; }
  for (const a of document.querySelectorAll("[data-go]")) a.onclick = ev => { ev.stopPropagation(); sel = a.dataset.go; tab = "lines"; hl = ""; drawTree(); drawMain(); };
  for (const r of document.querySelectorAll("tr[data-p]")) r.onclick = () => { sel = r.dataset.p; hl = r.dataset.l; tab = hl ? "lines" : "issues"; drawTree(); drawMain(); };
  for (const a of document.querySelectorAll("[data-open]")) a.onclick = async ev => {
    ev.stopPropagation();
    const file = a.dataset.file2 || a.dataset.open;
    const r = await (await fetch("/api/open", {method:"POST", body: JSON.stringify({file, where: a.dataset.where})})).json();
    toast(r.ok ? (r.msg === "ok" ? "Открыто в Excel: " + a.dataset.where : r.msg) : "Не открыто: " + r.error);
  };
}
$("#reload").onclick = async () => {
  $("#reload").disabled = true; $("#reload").textContent = "Читаю книги…";
  const r = await (await fetch("/api/reload", {method:"POST"})).json();
  $("#reload").disabled = false; $("#reload").textContent = "Обновить";
  if (!r.ok) toast("Ошибка: " + r.error); else { await load(); toast("Обновлено"); }
};
load();
</script>
</body>
</html>
