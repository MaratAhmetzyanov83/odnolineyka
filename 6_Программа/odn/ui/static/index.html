<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Объект — Однолинейка</title>
<link rel="stylesheet" href="style.css">
<script>try{const t=localStorage.getItem("odn-theme");if(t)document.documentElement.dataset.theme=t;}catch(e){}</script>
</head>
<body>
<header>
  <h1 id="title">Объект</h1>
  <span class="sub" id="stamp"></span>
  <span class="sp"></span>
  <button id="theme" title="Тема: авто (как в Windows) / светлая / тёмная">Тема: авто</button>
  <button id="reload" title="Перечитать книги, которые изменились">Обновить</button>
</header>
<div class="wrap">
  <aside id="tree"></aside>
  <main id="main"><div class="empty">Загрузка…</div></main>
</div>
<div class="msg" id="msg"></div>
<script type="module" src="js/app.js"></script>
</body>
</html>
